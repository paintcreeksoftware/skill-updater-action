name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Check Format
        id: format-check
        run: pnpm format:check

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Test
        id: ci-test
        run: pnpm ci-test

  # The hello-world template's "GitHub Actions Test" smoke job is removed in
  # PAI-123 because the new stub run() unconditionally fails (and the old
  # `milliseconds: 2000` input no longer exists). PAI-129 (orchestrator)
  # re-adds a smoke job that wires the real `sources` input + a stub
  # ANTHROPIC_API_KEY against a fixture skill and asserts the action runs
  # end-to-end.
