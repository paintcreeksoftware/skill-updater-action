name: Skill Updater
description:
  Pull upstream sources and use the Claude API to keep Claude skill repos
  auto-updated, opening a single rolling PR per run.
author: Paint Creek Software

branding:
  icon: refresh-cw
  color: blue

# Inputs and outputs land in PAI-124 (input schema) and PAI-129 (orchestrator
# wires the pr-url output). This stub deliberately exposes none — running the
# action today fails fast with a "not implemented" message via setFailed.

runs:
  using: node24
  main: dist/index.js
