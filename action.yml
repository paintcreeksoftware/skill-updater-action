name: Skill Updater
description:
  Pull upstream sources and use the Claude API to keep Claude skill repos
  auto-updated, opening a single rolling PR per run.
author: Paint Creek Software

branding:
  icon: refresh-cw
  color: blue

inputs:
  sources:
    description: |
      Multi-line YAML map of skill name -> list of sources to pull for that
      skill. Each source has a `type` of `web`, `git`, or `rss` and a `url`.
      Skill names must match a discovered SKILL.md location in the repo.
      See README for the full schema and a worked example.
    required: true
  anthropic-api-key:
    description:
      Anthropic API key for the synthesis call. Pass via the workflow's
      `secrets.ANTHROPIC_API_KEY` expression.
    required: true
  github-token:
    description: |
      Fine-grained PAT or GitHub App installation token with `contents: write`
      and `pull-requests: write` on the consumer repo. NOT the default
      GITHUB_TOKEN — the action refuses to start if the input matches the
      default token (PRs opened with it don't trigger workflows on the target
      branch). See README for why.
    required: true
  model:
    description: Anthropic model ID for synthesis. Defaults to claude-opus-4-7.
    required: false
    default: claude-opus-4-7
  branch:
    description:
      Rolling branch the action force-pushes per-run. Defaults to
      skill-updater/auto.
    required: false
    default: skill-updater/auto

# Outputs land in PAI-129 (orchestrator wires pr-url). The current stub fails
# fast via setFailed and produces no outputs.

runs:
  using: node24
  main: dist/index.js
